name: Build images and deploy TEAM ID

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      refresh_images:
        description: 'Retry original sources even when an image is already cached'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: team-id-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Test collector rules
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Restore previously downloaded originals
        id: image-cache
        uses: actions/cache/restore@v4
        with:
          path: .image-cache
          key: team-id-originals-v6-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            team-id-originals-v6-
      - name: Prepare static website
        run: python scripts/build_site.py
      - name: Download logos and front-view jersey candidates
        id: collect
        env:
          REFRESH: ${{ inputs.refresh_images }}
        run: |
          extra=()
          if [ "$REFRESH" = "true" ]; then extra+=(--refresh); fi
          python scripts/collect_assets.py --output _site --cache .image-cache --workers 6 --seconds 900 "${extra[@]}"
      - name: Save successful originals for the next build
        if: always() && steps.collect.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: .image-cache
          key: team-id-originals-v6-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Downloadable website, images, and missing-image report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-id-site-and-image-report
          path: _site/
          if-no-files-found: error
          retention-days: 14
      - name: Package Pages site
        if: success()
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
